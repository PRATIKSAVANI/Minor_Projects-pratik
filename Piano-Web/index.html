<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Piano Web </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #343434 0%, #111 45%, #050505 100%);

            color: white;
            overflow-x: hidden;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 95%;
            max-width: 1050px;
            text-align: center;
            padding: 40px 20px;
        }


        /* =========================
           HEADING
        ========================= */

        .badge {
            display: inline-block;
            padding: 7px 18px;

            border: 1px solid #555;
            border-radius: 30px;

            color: #aaa;
            font-size: 13px;
            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 3px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #aaa,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #aaa;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .subtitle strong {
            color: white;
        }


        /* =========================
           PIANO BOX
        ========================= */

        .piano-wrapper {
            padding: 25px;

            background: linear-gradient(
                145deg,
                #252525,
                #0d0d0d
            );

            border: 1px solid #444;

            border-radius: 20px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255,255,255,0.08);

            overflow-x: auto;
        }


        /* =========================
           PIANO
        ========================= */

        .piano {
            position: relative;

            display: flex;
            justify-content: center;

            min-width: 650px;

            padding: 18px 15px 15px;

            background: #090909;

            border-radius: 12px;

            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.9);
        }


        /* =========================
           WHITE KEYS
        ========================= */

        .key {
            position: relative;

            width: 85px;
            height: 280px;

            background: linear-gradient(
                to right,
                #ffffff,
                #eeeeee,
                #ffffff
            );

            border: 1px solid #aaa;

            border-radius: 0 0 8px 8px;

            cursor: pointer;

            margin: 0 2px;

            color: #333;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            padding-bottom: 22px;

            font-size: 17px;
            font-weight: bold;

            box-shadow:
                0 7px 0 #aaa,
                0 12px 18px rgba(0,0,0,0.5);

            transition:
                transform 0.08s,
                background 0.2s,
                box-shadow 0.08s;
        }


        /* =========================
           KEY LETTER
        ========================= */

        .key span {
            font-size: 15px;
            color: #777;
        }


        /* =========================
           HOVER
        ========================= */

        .key:hover {
            background: linear-gradient(
                to bottom,
                #ffffff,
                #dcecff
            );

            box-shadow:
                0 7px 0 #999,
                0 12px 22px rgba(100,160,255,0.25);

            transform: translateY(2px);
        }


        /* =========================
           ACTIVE
        ========================= */

        .key:active,
        .key.active {
            transform: translateY(7px);

            background: linear-gradient(
                to bottom,
                #b9dcff,
                #e9f5ff
            );

            box-shadow:
                0 0 0 #aaa,
                0 5px 15px rgba(100,180,255,0.4);
        }


        /* =========================
           NOTE DISPLAY
        ========================= */

        .note-display {
            margin-top: 30px;

            min-height: 75px;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            background: rgba(255,255,255,0.04);

            border: 1px solid #333;

            border-radius: 15px;

            padding: 15px;
        }

        .note-title {
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #currentNote {
            font-size: 28px;
            font-weight: bold;
            margin-top: 4px;

            color: white;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 30px;

            color: #666;

            font-size: 13px;
        }

        footer span {
            color: #aaa;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .container {
                padding: 30px 10px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
            }

            .piano-wrapper {
                padding: 12px;
            }

            .piano {
                min-width: 560px;
                padding: 12px 8px 10px;
            }

            .key {
                width: 70px;
                height: 230px;

                font-size: 14px;
            }

            .note-display {
                margin-top: 20px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 450px) {

            h1 {
                font-size: 27px;
            }

            .badge {
                font-size: 10px;
            }

            .piano {
                min-width: 490px;
            }

            .key {
                width: 60px;
                height: 200px;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            Pratik S.
        </div>

        <h1>🎹 Piano Web</h1>


        <!-- PIANO -->

        <div class="piano-wrapper">

            <div class="piano">

                <div class="key" data-note="C">
                    <span>C</span>
                </div>

                <div class="key" data-note="D">
                    <span>D</span>
                </div>

                <div class="key" data-note="E">
                    <span>E</span>
                </div>

                <div class="key" data-note="F">
                    <span>F</span>
                </div>

                <div class="key" data-note="G">
                    <span>G</span>
                </div>

                <div class="key" data-note="A">
                    <span>A</span>
                </div>

                <div class="key" data-note="B">
                    <span>B</span>
                </div>

            </div>

        </div>


        <!-- NOTE DISPLAY -->

        <div class="note-display">

            <div class="note-title">
                Currently Playing
            </div>

            <div id="currentNote">
                —
            </div>

        </div>


        <footer>
            Built with <span>HTML • CSS • JavaScript Events</span>
        </footer>

    </div>


    <!-- AUDIO FILES -->

    <audio id="audio-C" src="./Piano_a6-102820.mp3"></audio>
    <audio id="audio-D" src="./Piano_b6-82013.mp3"></audio>
    <audio id="audio-E" src="./Piano_c6-82013.mp3"></audio>
    <audio id="audio-F" src="./Piano_d6-82020.mp3"></audio>
    <audio id="audio-G" src="./Piano_e6-82016.mp3"></audio>
    <audio id="audio-A" src="./Piano_f6-102819.mp3"></audio>
    <audio id="audio-B" src="./Piano_g6-82013.mp3"></audio>


    <script>

        const keys = document.querySelectorAll(".key");

        const currentNote =
            document.getElementById("currentNote");


        keys.forEach(function(key) {

            const note =
                key.getAttribute("data-note");

            const audio =
                document.getElementById("audio-" + note);


            /* =========================
               CLICK EVENT
            ========================= */

            key.addEventListener("click", function() {

                audio.currentTime = 0;

                audio.play();

                currentNote.textContent = note;

                key.classList.add("active");

                setTimeout(function() {
                    key.classList.remove("active");
                }, 150);

            });


            /* =========================
               MOUSEOVER EVENT
            ========================= */

            key.addEventListener("mouseover", function() {

                key.style.background =
                    "linear-gradient(to bottom, #ffffff, #dcecff)";

            });


            /* =========================
               MOUSEOUT EVENT
            ========================= */

            key.addEventListener("mouseout", function() {

                key.style.background =
                    "linear-gradient(to right, #ffffff, #eeeeee, #ffffff)";

            });

        });


        /* =========================
           KEYBOARD SUPPORT
        ========================= */

        document.addEventListener("keydown", function(event) {

            const keyMap = {
                "a": "C",
                "s": "D",
                "d": "E",
                "f": "F",
                "g": "G",
                "h": "A",
                "j": "B"
            };

            const note = keyMap[event.key.toLowerCase()];

            if (!note) return;


            const key =
                document.querySelector(
                    `[data-note="${note}"]`
                );

            const audio =
                document.getElementById("audio-" + note);


            audio.currentTime = 0;
            audio.play();

            currentNote.textContent = note;

            key.classList.add("active");

        });


        document.addEventListener("keyup", function(event) {

            const keyMap = {
                "a": "C",
                "s": "D",
                "d": "E",
                "f": "F",
                "g": "G",
                "h": "A",
                "j": "B"
            };

            const note = keyMap[event.key.toLowerCase()];

            if (!note) return;


            const key =
                document.querySelector(
                    `[data-note="${note}"]`
                );

            key.classList.remove("active");

        });

    </script>

</body>

</html>
